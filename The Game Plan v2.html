<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: "Inter", sans-serif; }
.phone-shell {
  width: 393px; height: 852px; background: oklch(97% 0.012 75);
  border-radius: 54px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 10px #2a2a2a, 0 0 0 12px #444, 0 40px 80px rgba(0,0,0,0.7);
  display: flex; flex-direction: column;
}
.status-bar { height: 54px; padding: 16px 28px 0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; position: relative; z-index: 10; }
.status-time { font-size: 15px; font-weight: 600; color: #1c2b1e; }
.status-icons { display: flex; gap: 6px; align-items: center; }
.dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; }
.screen-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.home-indicator { height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.home-bar { width: 130px; height: 5px; background: rgba(28,43,30,0.25); border-radius: 3px; }

:root {
  --cream: oklch(97% 0.012 75);
  --sage: oklch(52% 0.09 155);
  --sage-bg: oklch(94% 0.04 155);
  --terra: oklch(58% 0.11 50);
  --terra-bg: oklch(93% 0.04 50);
  --amber: oklch(68% 0.14 75);
  --amber-bg: oklch(95% 0.06 75);
  --navy: #1c2b1e;
  --mid: #4a5c4d;
  --soft: #8a9e8d;
  --line: oklch(93% 0.015 75);
}

@keyframes cardIn { from { transform: translateX(48px) scale(0.97); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
@keyframes fadeUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideDown { from { max-height: 0; opacity: 0; } to { max-height: 200px; opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ── INFO SHEET ── */
.info-scrim { position: absolute; inset: 0; background: rgba(28,43,30,0.45); z-index: 200; animation: scrimIn 0.2s ease; }
.info-sheet {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 201;
  background: white; border-radius: 28px 28px 0 0;
  max-height: 78%; display: flex; flex-direction: column;
  padding-bottom: 44px;
  animation: sheetUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  touch-action: none;
}
.info-sheet-handle { display: flex; justify-content: center; padding: 12px 0 0; flex-shrink: 0; cursor: grab; }
.info-sheet-drag { width: 36px; height: 4px; border-radius: 2px; background: var(--line); }

/* ── CONFIRM DIALOG ── */
.confirm-scrim { position: absolute; inset: 0; background: rgba(28,43,30,0.5); z-index: 300; animation: scrimIn 0.15s ease; display: flex; align-items: flex-end; }
.confirm-sheet { background: white; border-radius: 28px 28px 0 0; width: 100%; padding: 22px 20px 12px; animation: sheetUp 0.25s cubic-bezier(0.32,0.72,0,1); }
.confirm-title { font-family: "Lora", serif; font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.confirm-body { font-size: 13px; color: var(--mid); line-height: 1.55; margin-bottom: 18px; }
.confirm-btns { display: flex; flex-direction: column; gap: 8px; }
.confirm-btn-dest { width: 100%; height: 50px; border: none; background: oklch(92% 0.04 10); color: oklch(44% 0.1 10); border-radius: 15px; font-size: 14px; font-weight: 600; cursor: pointer; }
.confirm-btn-stay { width: 100%; height: 50px; border: none; background: var(--sage); color: white; border-radius: 15px; font-size: 14px; font-weight: 600; cursor: pointer; }

/* ── RESET BUTTON ── */
.reset-btn { padding: 0; border: none; background: transparent; color: var(--soft); font-size: 11px; font-weight: 400; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; opacity: 0.5; letter-spacing: 0.01em; margin-top: 6px; -webkit-tap-highlight-color: transparent; }
.reset-btn:active { opacity: 1; }
.info-sheet-header { padding: 14px 22px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.info-sheet-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); margin-bottom: 2px; }
.info-sheet-title { font-family: "Lora", serif; font-size: 18px; font-weight: 700; color: var(--navy); }
.info-sheet-close { width: 28px; height: 28px; border-radius: 8px; border: none; background: var(--line); cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.info-sheet-divider { height: 1px; background: var(--line); margin: 0 22px; flex-shrink: 0; }
.info-sheet-body { overflow-y: auto; padding: 12px 0 4px; flex: 1; scrollbar-width: none; }
.info-sheet-body::-webkit-scrollbar { display: none; }
.info-block { background: oklch(97% 0.01 75); margin: 0 16px 10px; border-radius: 14px; padding: 12px 14px; }
.info-block-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--soft); margin-bottom: 5px; }
.info-block-txt { font-size: 13px; color: var(--navy); line-height: 1.55; }

/* ── INFO BUTTON on options ── */
.opt-info-btn {
  width: 28px; height: 28px; border-radius: 9px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.12s; -webkit-tap-highlight-color: transparent;
  background: var(--sage-bg); color: var(--sage);
}
.opt.sel .opt-info-btn { background: rgba(255,255,255,0.6); }
@keyframes tipSlideIn { from { transform: translateX(var(--tip-from, 40px)); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes tipSlideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(var(--tip-to, -40px)); opacity: 0; } }

.screen { width: 100%; height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ── HOME ── */
.home-hero { padding: 24px 24px 18px; background: linear-gradient(155deg, oklch(94% 0.05 155) 0%, var(--cream) 65%); display: flex; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; color: var(--sage); text-transform: uppercase; margin-bottom: 4px; }
.hero-title { font-family: "Lora", serif; font-size: 27px; font-weight: 600; color: var(--navy); line-height: 1.25; margin-bottom: 6px; }
.hero-sub { font-size: 13px; color: var(--mid); line-height: 1.5; }
.prow { display: flex; gap: 10px; padding: 12px 20px; }
.ppill { flex: 1; background: white; border-radius: 16px; padding: 12px 14px; box-shadow: 0 1px 8px rgba(28,43,30,0.08); display: flex; align-items: center; gap: 10px; cursor: pointer; border: none; text-align: left; font: inherit; color: inherit; transition: transform 120ms ease, box-shadow 120ms ease; -webkit-tap-highlight-color: transparent; }
.ppill:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(28,43,30,0.08); }
.ppill:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.pring { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
.pring svg { transform: rotate(-90deg); }
.pring-lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; }
.pinfo-name { font-size: 10px; font-weight: 500; color: var(--soft); text-transform: uppercase; letter-spacing: 0.05em; }
.pinfo-val { font-size: 13px; font-weight: 600; color: var(--navy); margin-top: 1px; }
.sec-lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); padding: 0 20px; margin-bottom: 10px; }
.cards { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.hcard { background: white; border-radius: 22px; padding: 20px 20px 18px; box-shadow: 0 2px 16px rgba(28,43,30,0.08); cursor: pointer; transition: transform 0.15s; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.hcard:active { transform: scale(0.98); }
.hcard-accent { position: absolute; top: 0; right: 0; width: 80px; height: 80px; border-radius: 0 22px 0 80px; opacity: 0.1; }
.hcard-icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
.hcard-pre { font-size: 10px; font-weight: 600; color: var(--soft); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 2px; }
.hcard-title { font-family: "Lora", serif; font-size: 19px; font-weight: 600; color: var(--navy); margin-bottom: 2px; }
.hcard-sub { font-size: 11px; color: var(--soft); font-style: italic; margin-bottom: 10px; }
.hcard-desc { font-size: 12px; color: var(--mid); line-height: 1.5; margin-bottom: 12px; }
.hcard-foot { display: flex; align-items: center; justify-content: space-between; }
.hcard-meta { font-size: 11px; color: var(--soft); }
.hcard-cta { font-size: 13px; font-weight: 600; color: var(--sage); }

/* ── INTERVIEW HEADER ── */
.ihead { padding: 13px 18px 11px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(28,43,30,0.07); background: var(--cream); flex-shrink: 0; }
.back-btn { width: 34px; height: 34px; border-radius: 11px; background: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 6px rgba(28,43,30,0.1); -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.ihead-info { flex: 1; }
.ihead-title { font-family: "Lora", serif; font-size: 16px; font-weight: 600; color: var(--navy); }
.prog-bar { height: 3px; background: oklch(88% 0.05 155); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--sage); border-radius: 2px; transition: width 0.4s ease; }
.ihead-ct { font-size: 11px; color: var(--soft); font-weight: 600; flex-shrink: 0; }

/* ── BIRTH PLAN QUESTIONS ── */
.qarea { flex: 1; padding: 14px 16px 8px; display: flex; flex-direction: column; overflow: hidden; }
.qcard { background: white; border-radius: 22px; padding: 18px 18px 16px; box-shadow: 0 4px 20px rgba(28,43,30,0.09); margin-bottom: 10px; animation: cardIn 0.3s ease forwards; flex-shrink: 0; position: relative; }
.qtag { display: inline-flex; background: var(--sage-bg); color: var(--sage); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 7px; padding: 3px 9px; margin-bottom: 9px; }
.qtext { font-family: "Lora", serif; font-size: 17px; font-weight: 600; color: var(--navy); line-height: 1.35; margin-bottom: 5px; }
.qctx { font-size: 12px; color: var(--mid); line-height: 1.55; }
.flag-btn { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 10px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
.flag-btn.on { background: var(--amber-bg); }
.opts { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.opts::-webkit-scrollbar { display: none; }
.opt { background: white; border: 2px solid oklch(91% 0.02 75); border-radius: 14px; padding: 11px 14px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.12s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.opt:active { transform: scale(0.98); }
.opt.sel { border-color: var(--sage); background: var(--sage-bg); }
/* Radio = round, Checkbox = square */
.ocheck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid oklch(80% 0.04 75); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
.ocheck-sq { width: 20px; height: 20px; border-radius: 5px; border: 2px solid oklch(80% 0.04 75); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
.opt.sel .ocheck { background: var(--sage); border-color: var(--sage); }
.opt.sel .ocheck-sq { background: var(--sage); border-color: var(--sage); }
.type-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); margin-bottom: 6px; }
.olbl { font-size: 13px; font-weight: 500; color: var(--navy); line-height: 1.3; flex: 1; }
.osub { font-size: 11px; color: var(--soft); margin-top: 1px; }


/* Branch sub-question */
.branch-card {
  background: oklch(96% 0.03 155); border-radius: 16px; padding: 14px 14px 10px;
  border-left: 3px solid var(--sage); margin-bottom: 8px; flex-shrink: 0;
  animation: fadeUp 0.25s ease forwards;
}
.branch-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sage); margin-bottom: 6px; }
.branch-q { font-family: "Lora", serif; font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.35; margin-bottom: 4px; }
.branch-ctx { font-size: 11px; color: var(--mid); line-height: 1.5; margin-bottom: 10px; }
.branch-opt { background: white; border: 2px solid oklch(88% 0.03 155); border-radius: 12px; padding: 10px 13px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 9px; transition: all 0.12s; -webkit-tap-highlight-color: transparent; margin-bottom: 6px; width: 100%; }
.branch-opt.sel { border-color: var(--sage); background: white; }
.branch-ocheck { width: 18px; height: 18px; border-radius: 5px; border: 2px solid oklch(80% 0.04 75); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
.branch-opt.sel .branch-ocheck { background: var(--sage); border-color: var(--sage); }
.custom-row { border: 2px dashed oklch(85% 0.03 75); border-radius: 14px; overflow: hidden; flex-shrink: 0; }
.custom-trigger { width: 100%; padding: 11px 14px; background: transparent; border: none; display: flex; align-items: center; gap: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.custom-expand { padding: 4px 12px 12px; animation: fadeUp 0.2s ease; }
.custom-inp { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; font-family: "Inter", sans-serif; font-size: 13px; color: var(--navy); background: white; outline: none; transition: border-color 0.15s; }
.custom-inp:focus { border-color: var(--sage); }
.custom-save { margin-top: 7px; width: 100%; height: 34px; border: none; background: var(--sage); border-radius: 9px; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
.flag-strip { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 12px; margin-top: 4px; cursor: pointer; border: 2px solid oklch(91% 0.02 75); background: white; transition: all 0.12s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.flag-strip.on { border-color: var(--amber); background: var(--amber-bg); }
.flag-lbl { font-size: 12px; font-weight: 500; color: var(--mid); }
.flag-strip.on .flag-lbl { color: oklch(48% 0.12 75); }
.mhint { font-size: 10px; color: var(--soft); text-align: center; margin-bottom: 5px; font-style: italic; }
.nav-row { padding: 10px 16px 8px; display: flex; gap: 8px; flex-shrink: 0; }
.nav-skip { flex: 0 0 auto; padding: 0 18px; height: 50px; border: none; background: oklch(93% 0.018 75); border-radius: 15px; font-size: 13px; font-weight: 500; color: var(--mid); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav-next { flex: 1; height: 50px; border: none; background: var(--sage); border-radius: 15px; font-size: 14px; font-weight: 600; color: white; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
.nav-next:disabled { opacity: 0.35; }
.nav-next.terra { background: var(--terra); }

/* ── BAG INTERVIEW ── */
.bag-icard { background: white; border-radius: 22px; padding: 18px 18px 14px; box-shadow: 0 4px 20px rgba(28,43,30,0.09); margin: 14px 16px 10px; animation: cardIn 0.3s ease forwards; flex-shrink: 0; }
.bag-cat-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.bag-cat-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.bag-cat-name { font-family: "Lora", serif; font-size: 18px; font-weight: 600; color: var(--navy); }
.bag-cat-sub { font-size: 11px; color: var(--soft); margin-top: 1px; }
.bag-hint { font-size: 11px; color: var(--mid); background: oklch(95% 0.03 155); border-radius: 8px; padding: 7px 11px; margin-bottom: 10px; line-height: 1.45; }

/* Bag item selection rows */
.bag-sel-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.bag-sel-item:last-of-type { border-bottom: none; }
.bag-iname { font-size: 13px; font-weight: 500; color: var(--navy); }
.bag-iname.off { color: var(--soft); }
.bag-inote { font-size: 11px; color: var(--soft); margin-top: 1px; }
.bag-stage-badge { margin-left: auto; font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
.badge-prep { background: oklch(93% 0.03 220); color: oklch(45% 0.08 220); }
.badge-labor { background: var(--sage-bg); color: var(--sage); }
.badge-post { background: var(--terra-bg); color: var(--terra); }
/* Pill chip toggle */
.bag-chip { border: none; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; flex-shrink: 0; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; gap: 5px; }
.bag-chip.in { background: var(--terra-bg); color: var(--terra); padding: 5px 8px 5px 11px; }
.bag-chip.in:active { background: oklch(88% 0.08 20); color: oklch(44% 0.14 20); transform: scale(0.95); }
.bag-chip.out { background: oklch(93% 0.02 75); color: var(--soft); padding: 5px 11px; border: 1.5px dashed oklch(82% 0.03 75); }
.bag-chip.out:active { background: var(--terra-bg); color: var(--terra); transform: scale(0.95); }
.bag-chip-x { width: 14px; height: 14px; border-radius: 50%; background: rgba(180,90,40,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Custom item add form */
.bag-add-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 2px dashed oklch(85% 0.03 75); background: transparent; cursor: pointer; width: 100%; margin-top: 8px; -webkit-tap-highlight-color: transparent; transition: border-color 0.15s; }
.bag-add-btn:hover { border-color: var(--terra); }
.bag-add-lbl { font-size: 13px; font-weight: 500; color: var(--soft); }
.bag-add-form { background: oklch(96% 0.02 75); border-radius: 14px; padding: 12px 14px; margin-top: 8px; animation: fadeUp 0.2s ease; }
.bag-add-field { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; font-family: "Inter", sans-serif; font-size: 13px; color: var(--navy); background: white; outline: none; margin-bottom: 8px; transition: border-color 0.15s; }
.bag-add-field:focus { border-color: var(--terra); }
.stage-pills { display: flex; gap: 6px; margin-bottom: 8px; }
.stage-pill { flex: 1; padding: 6px 0; border: none; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.12s; }
.stage-pill.active-prep { background: oklch(88% 0.05 220); color: oklch(40% 0.08 220); }
.stage-pill.active-labor { background: var(--sage-bg); color: var(--sage); }
.stage-pill.active-post { background: var(--terra-bg); color: var(--terra); }
.stage-pill.inactive { background: white; color: var(--soft); border: 1px solid var(--line); }
.bag-add-row { display: flex; gap: 6px; }
.bag-add-cancel { flex: 0 0 auto; padding: 0 14px; height: 34px; border: none; background: white; border-radius: 9px; font-size: 12px; font-weight: 500; color: var(--mid); cursor: pointer; }
.bag-add-save { flex: 1; height: 34px; border: none; background: var(--terra); border-radius: 9px; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }

/* Custom item remove */
.bag-custom-del { width: 20px; height: 20px; border-radius: 50%; border: none; background: oklch(90% 0.03 75); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: auto; }

/* ── BIRTH SUMMARY ── */
.sum-hero { padding: 26px 20px 22px; text-align: center; background: linear-gradient(170deg, oklch(88% 0.07 155) 0%, oklch(94% 0.04 155) 100%); }
.sum-stats { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
.sum-stat { background: white; border-radius: 14px; padding: 10px 18px; text-align: center; box-shadow: 0 2px 10px rgba(28,43,30,0.08); }
